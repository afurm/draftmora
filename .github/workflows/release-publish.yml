name: Release Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.1"
        required: true
        type: string
      dry_run:
        description: "Run npm publish as a dry run"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish to npm
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tag = process.env.RELEASE_TAG?.replace(/^v/, "");
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));

          if (tag !== version) {
            console.error(`Release tag ${process.env.RELEASE_TAG} does not match package.json version ${version}.`);
            process.exit(1);
          }
          NODE

      - name: Audit dependencies
        run: npm audit

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          OPENAI_API_KEY: ""

      - name: Build
        run: npm run build
        env:
          OPENAI_API_KEY: ""

      - name: Package smoke
        run: npm pack --dry-run

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --dry-run

      - name: Publish to npm
        if: github.event_name == 'release' || !inputs.dry_run
        run: npm publish --access public
