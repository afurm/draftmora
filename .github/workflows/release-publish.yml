name: Release Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.1"
        required: true
        type: string
      dry_run:
        description: "Run npm publish as a dry run"
        required: true
        type: boolean
        default: true
      publish_npm:
        description: "Publish to npmjs.com"
        required: true
        type: boolean
        default: true
      publish_github_packages:
        description: "Publish to GitHub Packages as @afurm/draftmora"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: release-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tag = process.env.RELEASE_TAG?.replace(/^v/, "");
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));

          if (tag !== version) {
            console.error(`Release tag ${process.env.RELEASE_TAG} does not match package.json version ${version}.`);
            process.exit(1);
          }
          NODE

      - name: Audit dependencies
        run: npm audit

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          OPENAI_API_KEY: ""

      - name: Build
        run: npm run build
        env:
          OPENAI_API_KEY: ""

      - name: Package smoke
        run: npm pack --dry-run

      - name: Publish npm dry run
        if: github.event_name == 'workflow_dispatch' && inputs.publish_npm && inputs.dry_run
        run: npm publish --access public --dry-run

      - name: Publish to npm
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm && !inputs.dry_run)
        run: npm publish --access public

      - name: Configure GitHub Packages metadata
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_github_packages)
        run: |
          npm pkg set name="@afurm/draftmora" publishConfig.registry="https://npm.pkg.github.com"
          printf '@afurm:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Packages dry run
        if: github.event_name == 'workflow_dispatch' && inputs.publish_github_packages && inputs.dry_run
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_github_packages && !inputs.dry_run)
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
