name: Setup help
description: Get help installing or running Draftmora locally.
title: "[Setup]: "
labels:
  - setup
body:
  - type: textarea
    id: problem
    attributes:
      label: What is going wrong?
      description: Describe the install, startup, or configuration problem.
    validations:
      required: true

  - type: textarea
    id: commands
    attributes:
      label: Commands run
      description: Include the exact commands and redacted output.
      render: shell
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15 / Ubuntu 24.04 / Windows 11 WSL2
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.14.0
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - npm install
        - npm run dev
        - OpenAI setup
        - SQLite data path
        - Browser UI
        - Other
    validations:
      required: true
